name: NSE Daily Deals Email Report

on:
  # Three staggered crons so GHA scheduling lag (observed 2–6 h on this repo)
  # cannot silently skip a day. All jobs sleep until exactly 09:45 IST before
  # scraping and sending. Whichever wakes first claims the slot and sends;
  # the others hit a 409 conflict and exit cleanly — no duplicate emails.
  schedule:
    - cron: "0 0 * * 2-6"    # 00:00 UTC → arrives ~06:00–08:00 IST, sleeps to 09:45
    - cron: "30 1 * * 2-6"   # 01:30 UTC → arrives ~07:00–09:30 IST, sleeps to 09:45
    - cron: "0 3 * * 2-6"    # 03:00 UTC → arrives ~08:30–10:00 IST, sleeps to 09:45
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "9:45 IST daily deals report"
    runs-on: ubuntu-latest
    timeout-minutes: 210   # up to 3.5 h sleep + 25 min work

    steps:
      - name: Wait until 09:45 IST
        run: |
          TARGET=$(TZ=Asia/Kolkata date -d "today 09:45" +%s)
          NOW=$(date +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ]; then
            echo "Sleeping ${WAIT}s ($(( WAIT / 60 )) min) until 09:45 IST"
            sleep "$WAIT"
          else
            echo "Already past 09:45 IST — proceeding immediately"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scrape runs at 9:45 IST immediately before the report.
      # Upserts are idempotent — safe to re-run even if daily_scrape already ran.
      - name: Refresh bulk / block / short deals (pre-report scrape)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --datasets bulk_deals block_deals short_deals

      - name: Send daily deals report (9:45 IST)
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'BAC Daily Deals' }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m reports.daily_deals_report

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
