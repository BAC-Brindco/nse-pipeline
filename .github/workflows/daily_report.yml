name: NSE Daily Deals Email Report

on:
  # Primary trigger: cron-job.org fires workflow_dispatch at exactly 04:30 UTC
  # (= 10:00 IST) every Tue–Sat via the GitHub API. These GHA schedules are
  # fallbacks only — they fire if cron-job.org misses a day.
  #
  # Old approach (sleep until 09:45 IST) was broken: the 00:00 UTC trigger needed
  # a 255-min sleep but timeout-minutes was 210, so it silently timed out every day.
  # Removed sleep entirely — _claim_slot() idempotency prevents duplicate emails
  # if more than one trigger fires close together.
  schedule:
    - cron: "30 4 * * 2-6"   # 04:30 UTC = 10:00 IST — primary GHA fallback
    - cron: "00 5 * * 2-6"   # 05:00 UTC = 10:30 IST — 30-min fallback
    - cron: "30 5 * * 2-6"   # 05:30 UTC = 11:00 IST — 1-hour fallback
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "10:00 IST daily deals report"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # scrape + report takes ~15 min; 30 is generous

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium renders the comprehensive edition to the attached PDF.
      # --with-deps pulls the shared libraries headless Chromium needs on the
      # runner image.
      #
      # continue-on-error, because render_pdf already degrades to None and sends
      # the email without the attachment. Letting a failed browser download abort
      # the job would turn a missing attachment into a missing report, which is
      # the opposite of the intended trade-off.
      - name: Install Chromium for PDF rendering
        continue-on-error: true
        run: playwright install --with-deps chromium

      # Last-minute scrape immediately before the report — upserts are idempotent.
      #
      # continue-on-error, because the report must go out even on a partial
      # scrape: a stale-but-labelled read beats no read at all. main.py now
      # exits non-zero when a dataset fails, so this step still shows red, and
      # the report's own _scrape_health() check labels the affected section as
      # unavailable rather than letting it render as zero. The job as a whole
      # goes red via the report step's exit code.
      - name: Refresh bulk / block / short deals (pre-report scrape)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --datasets bulk_deals block_deals short_deals

      # Index membership only — a few static CSVs, seconds to fetch, and it
      # keeps the NIFTY badges correct through index reshuffles. Market caps are
      # deliberately NOT refreshed here: that is ~1,400 Screener.in requests and
      # belongs in the weekly job, not the critical path of the morning email.
      # Non-fatal — a stale security master still ranks yesterday's way.
      - name: Refresh index membership
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scrapers.security_master_refresh --indices-only

      - name: Send daily deals report (10:00 IST)
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'BAC Daily Deals' }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m reports.daily_deals_report

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
