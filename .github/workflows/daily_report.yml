name: NSE Daily Deals Email Report

on:
  # Three runs per morning, Mon–Sat IST:
  #   08:00  the edition        — sent to REPORT_RECIPIENTS
  #   09:30  first re-check     — re-issued only if NSE published new deals
  #   10:30  final re-check     — same; short deals are the usual late arrivals
  # Every run also emails a one-line operator log to parv.bangar@brindco.com
  # only (reports/ops_log.py) — sent, no change, no report today, or failed.
  #
  # What a run does is decided from report_log, not from which trigger fired
  # (see "Run plan" in reports/daily_deals_report.py), so the triggers are
  # interchangeable and a duplicate is a silent no-op.
  #
  # Primary trigger: cron-job.org fires workflow_dispatch at 08:00, 09:30 and
  # 10:30 IST. These GHA schedules are fallbacks only — GitHub has delayed this
  # repo's schedules by hours, which is why cron-job.org is primary. Mondays
  # run too: there is no new session, so the run just logs "not sent".
  schedule:
    - cron: "30 2 * * 1-6"   # 02:30 UTC = 08:00 IST — edition
    - cron: "00 4 * * 1-6"   # 04:00 UTC = 09:30 IST — re-check
    - cron: "00 5 * * 1-6"   # 05:00 UTC = 10:30 IST — final re-check
  workflow_dispatch:

# Serialise runs so two triggers for the same slot cannot race each other.
concurrency:
  group: daily-deals-report
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "Daily deals report (08:00 edition / 09:30, 10:30 re-checks)"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # scrape + report takes ~15 min; 30 is generous

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium renders the comprehensive edition to the attached PDF.
      # --with-deps pulls the shared libraries headless Chromium needs on the
      # runner image.
      #
      # continue-on-error, because render_pdf already degrades to None and sends
      # the email without the attachment. Letting a failed browser download abort
      # the job would turn a missing attachment into a missing report, which is
      # the opposite of the intended trade-off.
      - name: Install Chromium for PDF rendering
        continue-on-error: true
        run: playwright install --with-deps chromium

      # Last-minute scrape immediately before the report — upserts are idempotent.
      #
      # continue-on-error, because the report must go out even on a partial
      # scrape: a stale-but-labelled read beats no read at all. main.py now
      # exits non-zero when a dataset fails, so this step still shows red, and
      # the report's own _scrape_health() check labels the affected section as
      # unavailable rather than letting it render as zero. The job as a whole
      # goes red via the report step's exit code.
      - name: Refresh bulk / block / short deals (pre-report scrape)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --datasets bulk_deals block_deals short_deals

      # Index membership only — a few static CSVs, seconds to fetch, and it
      # keeps the NIFTY badges correct through index reshuffles. Market caps are
      # deliberately NOT refreshed here: that is ~1,400 Screener.in requests and
      # belongs in the weekly job, not the critical path of the morning email.
      # Non-fatal — a stale security master still ranks yesterday's way.
      - name: Refresh index membership
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scrapers.security_master_refresh --indices-only

      - name: Send daily deals report / re-check for new deals
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'RAAS Daily Deals' }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m reports.daily_deals_report

      # Python sends its own log email for every outcome, including a report
      # that raised. This step covers the job dying before Python could say
      # anything (checkout, pip install, a missing secret). System python3 and
      # stdlib only, because the failed step may have been pip itself.
      - name: Email operator log if the job failed
        if: failure()
        env:
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: >
          python3 -m reports.ops_log --if-not-sent --report "Daily Deals"
          --status FAILED
          --headline "The daily deals workflow failed before the report step could report. Nothing was sent to the desk from this run."
          --detail "Trigger: ${{ github.event_name }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
