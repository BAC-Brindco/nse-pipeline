name: NSE Daily Deals Email Report

on:
  # Target: report lands in inboxes at 10:00 IST (Tue–Sat).
  # GHA on this repo lags scheduled runs by ~2–3 h, so we schedule at 01:30 UTC
  # to land at ~04:00–04:30 UTC = 09:30–10:00 IST.
  # A backup trigger at 03:30 UTC fires at ~06:00–06:30 UTC = 11:30–12:00 IST
  # in case NSE is late publishing short deals (the data-gate in the report
  # script prevents double-sending — only the first run that finds short deals
  # ready will claim the slot and send).
  #
  # Each run re-scrapes bulk/block/short deals immediately before composing,
  # so the report always reflects the freshest available data.
  schedule:
    - cron: "30 1 * * 2-6"   # 01:30 UTC T+1 → ~09:30–10:00 IST (primary)
    - cron: "30 3 * * 2-6"   # 03:30 UTC T+1 → ~11:30–12:00 IST (backup if NSE is late)
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "9:55 scrape → 10:00 report"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Final scrape runs immediately before the report (9:55 equivalent).
      # Upserts are idempotent — safe to re-run even if daily_scrape already ran.
      - name: Refresh bulk / block / short deals (pre-report scrape)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --datasets bulk_deals block_deals short_deals

      # Report script gates on short_deals being present before claiming the
      # send slot — exits cleanly if NSE hasn't published yet, so the backup
      # trigger can retry without double-sending.
      - name: Send daily deals report (10:00 IST)
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'BAC Daily Deals' }}
        run: python -m reports.daily_deals_report

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
