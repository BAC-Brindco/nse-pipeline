name: NSE Daily Deals Email Report

on:
  # Target: 9:45 AM IST, Tuesday–Saturday (T+1 for previous trading day).
  # IST = UTC+5:30, so 9:45 IST = 04:15 UTC.
  # GHA on this repo lags scheduled runs by ~2–3 h, so we schedule at 01:45 UTC
  # to land at ~04:00–04:45 UTC = 09:30–10:15 IST.
  # Short deals are included if NSE has published them by trigger time; if not,
  # the report sends with 0 short deals — no blocking on data completeness.
  schedule:
    - cron: "45 1 * * 2-6"   # 01:45 UTC T+1 → ~09:45 IST (Tue–Sat)
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "9:40 scrape → 9:45 report"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scrape runs immediately before the report to get the freshest data.
      # Upserts are idempotent — safe to re-run even if daily_scrape already ran.
      - name: Refresh bulk / block / short deals (pre-report scrape)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --datasets bulk_deals block_deals short_deals

      - name: Send daily deals report (9:45 IST)
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'BAC Daily Deals' }}
        run: python -m reports.daily_deals_report

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
